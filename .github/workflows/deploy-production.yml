# Production deployment over SSH
name: Deploy production

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-production]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: Ssh

    steps:
      - name: Validate deployment configuration
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          PRODUCTION_DOMAIN: ${{ vars.PRODUCTION_DOMAIN }}
          DJANGO_ADMIN_USERNAME: ${{ vars.DJANGO_ADMIN_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          CLOUDFLARE_ORIGIN_CERT: ${{ secrets.CLOUDFLARE_ORIGIN_CERT }}
          CLOUDFLARE_ORIGIN_KEY: ${{ secrets.CLOUDFLARE_ORIGIN_KEY }}
          DJANGO_ADMIN_PASSWORD: ${{ secrets.DJANGO_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${VPS_HOST}"
          test -n "${VPS_USER}"
          test -n "${PRODUCTION_DOMAIN}"
          test -n "${DJANGO_ADMIN_USERNAME}"
          test -n "${SSH_PRIVATE_KEY}"
          test -n "${VPS_KNOWN_HOSTS}"
          test -n "${CLOUDFLARE_ORIGIN_CERT}"
          test -n "${CLOUDFLARE_ORIGIN_KEY}"
          test -n "${DJANGO_ADMIN_PASSWORD}"
          [[ "${VPS_PORT}" =~ ^[0-9]{1,5}$ ]]
          [[ "${DEPLOY_PATH}" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "${PRODUCTION_DOMAIN}" =~ ^[A-Za-z0-9.-]+$ ]]

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${VPS_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Validate and stage origin certificate
        env:
          CLOUDFLARE_ORIGIN_CERT: ${{ secrets.CLOUDFLARE_ORIGIN_CERT }}
          CLOUDFLARE_ORIGIN_KEY: ${{ secrets.CLOUDFLARE_ORIGIN_KEY }}
          PRODUCTION_DOMAIN: ${{ vars.PRODUCTION_DOMAIN }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "${CLOUDFLARE_ORIGIN_CERT}" > /tmp/rengine-origin.pem
          printf '%s\n' "${CLOUDFLARE_ORIGIN_KEY}" > /tmp/rengine-origin.key
          openssl x509 -in /tmp/rengine-origin.pem -noout -checkend 86400
          openssl x509 -in /tmp/rengine-origin.pem -noout -ext subjectAltName |
            grep -Eq "DNS:(\\*\\.)?${PRODUCTION_DOMAIN//./\\.}"
          cert_public_key="$(
            openssl x509 -in /tmp/rengine-origin.pem -pubkey -noout |
              openssl pkey -pubin -outform DER |
              sha256sum |
              cut -d' ' -f1
          )"
          private_public_key="$(
            openssl pkey -in /tmp/rengine-origin.key -pubout -outform DER |
              sha256sum |
              cut -d' ' -f1
          )"
          test "${cert_public_key}" = "${private_public_key}"
          scp \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -P "${VPS_PORT}" \
            /tmp/rengine-origin.pem \
            /tmp/rengine-origin.key \
            "${VPS_USER}@${VPS_HOST}:~/"

      - name: Wait for SSH
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ssh \
              -i ~/.ssh/id_ed25519 \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 \
              -o ConnectionAttempts=2 \
              -p "${VPS_PORT}" \
              "${VPS_USER}@${VPS_HOST}" true; then
              exit 0
            fi
            if [[ "${attempt}" -lt 3 ]]; then
              echo "SSH connection attempt ${attempt} failed; retrying in 10 seconds."
              sleep 10
            fi
          done
          exit 1

      - name: Migrate database, deploy, and install
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          PRODUCTION_DOMAIN: ${{ vars.PRODUCTION_DOMAIN }}
          DJANGO_ADMIN_USERNAME: ${{ vars.DJANGO_ADMIN_USERNAME }}
          DJANGO_ADMIN_PASSWORD: ${{ secrets.DJANGO_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -p "${VPS_PORT}" \
            "${VPS_USER}@${VPS_HOST}" \
            "set -euo pipefail
             diagnose() {
               status=\$?
               echo 'Deployment failed; collecting container diagnostics.'
               docker compose -f docker/docker-compose.yml ps || true
               docker compose -f docker/docker-compose.yml logs --no-color --tail=200 db redis celery celery-beat web proxy || true
               exit \${status}
             }
             trap diagnose ERR
             cd -- '${DEPLOY_PATH}'
             test -f .env
             docker run --rm \
               -v \"\${PWD}/docker/secrets/certs:/certs\" \
               -v \"/home/${VPS_USER}/rengine-origin.pem:/source/rengine.pem:ro\" \
               -v \"/home/${VPS_USER}/rengine-origin.key:/source/rengine_rsa.key:ro\" \
               alpine:3.20 sh -c \
               'cp /source/rengine.pem /certs/rengine.pem &&
                cp /source/rengine_rsa.key /certs/rengine_rsa.key &&
                chmod 644 /certs/rengine.pem &&
                chmod 600 /certs/rengine_rsa.key'
             sed -i \"s/^DOMAIN_NAME=.*/DOMAIN_NAME=${PRODUCTION_DOMAIN}/\" .env
             rm -f \"/home/${VPS_USER}/rengine-origin.pem\" \"/home/${VPS_USER}/rengine-origin.key\"
             command -v docker
             docker compose version
             command -v make
             git pull --ff-only
             bash scripts/migrate_postgres_17_to_12.sh
             POSTGRES_VOLUME_NAME=\$(sed -n 's/^POSTGRES_VOLUME_NAME=//p' .env | tail -n 1 | tr -d '\r')
             [[ \"\${POSTGRES_VOLUME_NAME}\" == rengine_postgres_data_v12_* ]]
             export POSTGRES_VOLUME_NAME
             make pull
             if [[ ! -s web/secret ]]; then
               umask 077
               openssl rand -hex 32 > web/secret
             fi
             if [[ ! -f docker/secrets/certs/rengine_rsa.key || ! -f docker/secrets/certs/rengine_chain.pem || ! -f docker/secrets/certs/rengine.pem ]]; then
               make certs
             fi
             app_image=ghcr.io/security-tools-alliance/rengine-ng:rengine-celery-v\$(cat web/reNgine/version.txt)
             app_uid=\$(docker run --rm --entrypoint id \${app_image} -u rengine)
             app_gid=\$(docker run --rm --entrypoint id \${app_image} -g rengine)
             docker run --rm -v \"\${PWD}/web:/data\" alpine:3.20 sh -c \
               \"mkdir -p /data/staticfiles &&
                touch /data/errors.log /data/celery.log /data/celery_beat.log &&
                chown -R \${app_uid}:\${app_gid} /data/secret /data/staticfiles /data/errors.log /data/celery.log /data/celery_beat.log &&
                chmod 600 /data/secret &&
                chmod 664 /data/errors.log /data/celery.log /data/celery_beat.log\"
             RENGINE_VERSION=\$(cat web/reNgine/version.txt) docker compose -f docker/docker-compose.yml up -d db redis ollama
             RENGINE_VERSION=\$(cat web/reNgine/version.txt) docker compose -f docker/docker-compose.yml up -d --wait --wait-timeout 120 db redis
             RENGINE_VERSION=\$(cat web/reNgine/version.txt) docker compose -f docker/docker-compose.yml up -d --no-deps --force-recreate celery
             make up
             make superuser_changepassword \
               isNonInteractive=true \
               DJANGO_SUPERUSER_USERNAME='${DJANGO_ADMIN_USERNAME}' \
               DJANGO_SUPERUSER_PASSWORD='${DJANGO_ADMIN_PASSWORD}'
             RENGINE_VERSION=\$(cat web/reNgine/version.txt) docker compose -f docker/docker-compose.yml up -d --no-deps --force-recreate proxy
             if command -v ufw >/dev/null 2>&1; then
               if sudo -n ufw status >/dev/null 2>&1; then
                 sudo -n ufw allow 443/tcp
                 sudo -n ufw allow 8082/tcp
                 sudo -n ufw status
               else
                 docker run --rm --privileged --network host alpine:3.20 sh -c \
                   \"apk add --no-cache iptables >/dev/null &&
                    iptables -C INPUT -p tcp --dport 443 -j ACCEPT 2>/dev/null || iptables -I INPUT -p tcp --dport 443 -j ACCEPT
                    iptables -C INPUT -p tcp --dport 8082 -j ACCEPT 2>/dev/null || iptables -I INPUT -p tcp --dport 8082 -j ACCEPT\"
               fi
             fi
             docker run --rm --network host curlimages/curl:8.12.1 --fail --insecure --silent --output /dev/null https://127.0.0.1/
             docker compose -f docker/docker-compose.yml ps
             test -z \"\$(docker compose -f docker/docker-compose.yml ps --status exited -q)\""

      - name: Verify public HTTPS access
        env:
          PRODUCTION_DOMAIN: ${{ vars.PRODUCTION_DOMAIN }}
        run: |
          set -euo pipefail
          curl \
            --fail \
            --insecure \
            --show-error \
            --silent \
            --retry 6 \
            --retry-all-errors \
            --retry-delay 10 \
            --connect-timeout 15 \
            --max-time 30 \
            --output /dev/null \
            "https://${PRODUCTION_DOMAIN}/"

      - name: Remove SSH material
        if: always()
        run: |
          rm -f \
            ~/.ssh/id_ed25519 \
            ~/.ssh/known_hosts \
            /tmp/rengine-origin.pem \
            /tmp/rengine-origin.key
