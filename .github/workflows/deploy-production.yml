# Production deployment over SSH
name: Deploy production

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-production]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: Ssh

    steps:
      - name: Validate deployment configuration
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${VPS_HOST}"
          test -n "${VPS_USER}"
          test -n "${SSH_PRIVATE_KEY}"
          test -n "${VPS_KNOWN_HOSTS}"
          [[ "${VPS_PORT}" =~ ^[0-9]{1,5}$ ]]
          [[ "${DEPLOY_PATH}" =~ ^/[A-Za-z0-9._/-]+$ ]]

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${VPS_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy and install
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ssh \
              -i ~/.ssh/id_ed25519 \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 \
              -o ConnectionAttempts=2 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10 \
              -p "${VPS_PORT}" \
              "${VPS_USER}@${VPS_HOST}" \
              "set -euo pipefail
               cd -- '${DEPLOY_PATH}'
               test -f .env
               command -v docker
               docker compose version
               command -v make
               git pull --ff-only
               make pull
               make up
               docker compose -f docker/docker-compose.yml ps
               test -z \"\$(docker compose -f docker/docker-compose.yml ps --status exited -q)\""; then
              exit 0
            fi
            if [[ "${attempt}" -lt 3 ]]; then
              echo "SSH deployment attempt ${attempt} failed; retrying in 10 seconds."
              sleep 10
            fi
          done
          exit 1

      - name: Remove SSH material
        if: always()
        run: |
          rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
